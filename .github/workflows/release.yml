name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Prepare or publish GitHub Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check the auto-merge credential
        if: vars.AUTO_MERGE_RELEASE_PRS == 'true'
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          if [[ "$HAS_RELEASE_TOKEN" != 'true' ]]; then
            echo "::error::Set RELEASE_PLEASE_TOKEN for auto-merge so the merge triggers the publishing workflow."
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - name: Enable auto-merge for the generated release PR
        if: vars.AUTO_MERGE_RELEASE_PRS == 'true' && steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
